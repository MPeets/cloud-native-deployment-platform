name: Terraform Destroy

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Select "destroy" to tear down the non-bootstrap infrastructure.
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "destroy"

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_destroy == 'destroy'
    runs-on: ubuntu-latest

    environment: production
    env:
      TF_INFRA_ENVIRONMENT: ${{ vars.TF_INFRA_ENVIRONMENT }}
      TF_VAR_database_url_secret_arn: ${{ secrets.TF_DATABASE_URL_SECRET_ARN }}
      TF_VAR_aws_region: ${{ vars.TF_AWS_REGION }}
      TF_VAR_enable_ecs: ${{ vars.TF_ENABLE_ECS }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve container images from latest Docker CI on main
        id: resolve_images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: bash "${GITHUB_WORKSPACE}/scripts/ci_resolve_terraform_container_images.sh"

      - name: Require immutable container image refs
        env:
          TF_VAR_docker_image: ${{ steps.resolve_images.outputs.docker_image }}
          TF_VAR_worker_image: ${{ steps.resolve_images.outputs.worker_image }}
        run: bash "${GITHUB_WORKSPACE}/scripts/ci_require_immutable_container_tags.sh"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.TF_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          ENV_NAME="${TF_INFRA_ENVIRONMENT:-prod}"
          terraform init -backend-config="envs/${ENV_NAME}/backend.hcl" -reconfigure

      - name: Terraform Destroy Plan
        env:
          TF_VAR_docker_image: ${{ steps.resolve_images.outputs.docker_image }}
          TF_VAR_worker_image: ${{ steps.resolve_images.outputs.worker_image }}
        run: |
          ENV_NAME="${TF_INFRA_ENVIRONMENT:-prod}"
          terraform plan -destroy \
            -lock-timeout=10m \
            -var-file="envs/${ENV_NAME}/terraform.tfvars" \
            -out=tfdestroy

      - name: Terraform Destroy
        env:
          TF_VAR_docker_image: ${{ steps.resolve_images.outputs.docker_image }}
          TF_VAR_worker_image: ${{ steps.resolve_images.outputs.worker_image }}
        run: terraform apply -lock-timeout=10m tfdestroy
name: CI - Build & Push Docker Images

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "worker/**"
      - "migrate/**"
      - "migrations/**"
      - "scripts/run_migrations.py"
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json

      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm ci

      - name: Run app tests
        working-directory: ./app
        run: npm test

      - name: Run worker tests
        working-directory: ./worker
        run: npm test

      - name: Run lint
        working-directory: ./app
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: migrate/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image summary
        run: |
          {
            echo "### Docker images"
            echo ""
            echo "- Image SHA: \`${GITHUB_SHA}\`"
            echo "- API: \`${DOCKERHUB_USERNAME}/devops-api:${GITHUB_SHA}\`"
            echo "- Worker: \`${DOCKERHUB_USERNAME}/devops-worker:${GITHUB_SHA}\`"
            echo "- Migrate: \`${DOCKERHUB_USERNAME}/devops-migrate:${GITHUB_SHA}\`"
            echo ""
            echo "Use this Image SHA as the Terraform \`image_sha\` input for rollback or preview deployments."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true

      - name: Trivy scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-worker:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install health check dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run health check
        run: |
          cleanup() { docker rm -f test 2>/dev/null || true; }
          trap cleanup EXIT
          docker run -d -p 3000:3000 --name test ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:${{ github.sha }}
          python scripts/health_check.py --alb-dns localhost:3000 --retries 5 --skip-aws
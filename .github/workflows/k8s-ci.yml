name: Kubernetes CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "migrate/**"
      - "migrations/**"
      - "scripts/run_migrations.py"
      - "k8s/**"
      - ".github/workflows/k8s-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "migrate/**"
      - "migrations/**"
      - "scripts/run_migrations.py"
      - "k8s/**"
      - ".github/workflows/k8s-ci.yml"
  workflow_dispatch:

concurrency:
  group: k8s-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint k8s/charts/deployment-platform

      - name: Validate rendered manifests
        run: |
          helm template deployment-platform k8s/charts/deployment-platform \
            --set image.owner=local \
            --set image.tag=${{ github.sha }} \
            | docker run --rm -i ghcr.io/yannh/kubeconform -strict -summary

  kind-smoke:
    needs: chart-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NS: dp
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build images
        run: |
          docker build -t "local/devops-api:${TAG}" ./app
          docker build -t "local/devops-worker:${TAG}" ./worker
          docker build -t "local/devops-migrate:${TAG}" -f migrate/Dockerfile .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dp

      - name: Load images into kind
        run: |
          kind load docker-image "local/devops-api:${TAG}" --name dp
          kind load docker-image "local/devops-worker:${TAG}" --name dp
          kind load docker-image "local/devops-migrate:${TAG}" --name dp

      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Install Postgres
        run: |
          kubectl create namespace "$NS"
          kubectl apply -n "$NS" -f k8s/ci/postgres.yaml
          kubectl rollout status deployment/postgres -n "$NS" --timeout=3m

      - name: Create database secret
        run: |
          kubectl create secret generic dp-db \
            --namespace "$NS" \
            --from-literal=DATABASE_URL=postgres://postgres:postgres@postgres:5432/cloud-native-deployment-platform

      - name: Install chart
        run: |
          helm upgrade --install dp k8s/charts/deployment-platform \
            --namespace "$NS" \
            --values k8s/ci/values-kind.yaml \
            --set "image.tag=${TAG}" \
            --wait \
            --timeout 5m

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install health check dependencies
        run: pip install -r scripts/requirements.txt

      - name: Port-forward API and run health check
        run: |
          kubectl port-forward -n "$NS" svc/dp-api 8080:80 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/health && break
            sleep 1
          done
          python scripts/health_check.py --alb-dns localhost:8080 --retries 5 --skip-aws

      - name: Smoke deployment through the worker
        run: |
          kubectl port-forward -n "$NS" svc/dp-api 8080:80 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/health && break
            sleep 1
          done
          id=$(curl -fsS -X POST http://localhost:8080/deployments \
            -H 'Content-Type: application/json' \
            -d "{\"service\":\"smoke\",\"version\":\"${TAG}\"}" | jq -r '.id')
          if [[ -z "$id" || "$id" == "null" ]]; then
            echo "POST /deployments did not return an id" >&2
            exit 1
          fi
          echo "created deployment id=${id}"
          status=""
          for attempt in $(seq 1 30); do
            status=$(curl -fsS "http://localhost:8080/deployments/${id}" | jq -r '.status')
            echo "attempt ${attempt}: status=${status}"
            if [[ "$status" == "succeeded" ]]; then
              exit 0
            fi
            if [[ "$status" == "failed" ]]; then
              echo "deployment ${id} failed" >&2
              exit 1
            fi
            if [[ "$status" != "pending" && "$status" != "running" ]]; then
              echo "deployment ${id} returned unexpected status: ${status}" >&2
              exit 1
            fi
            if [[ "$attempt" -lt 30 ]]; then
              sleep 2
            fi
          done
          echo "deployment ${id} did not succeed after 30 attempts (last status: ${status})" >&2
          exit 1

      - name: Collect failure diagnostics
        if: failure()
        run: |
          kubectl get all -n "$NS" || true
          kubectl get events -n "$NS" --sort-by=.lastTimestamp || true
          kubectl describe pods -n "$NS" || true
          kubectl logs -n "$NS" -l app.kubernetes.io/instance=dp --all-containers --tail=200 || true
          if kubectl get job/dp-migrate -n "$NS" >/dev/null 2>&1; then
            kubectl logs -n "$NS" job/dp-migrate --all-containers --tail=200 || true
          else
            echo "migrate job not found"
          fi

name: Kubernetes CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "migrate/**"
      - "migrations/**"
      - "scripts/run_migrations.py"
      - "k8s/**"
      - ".github/workflows/k8s-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "migrate/**"
      - "migrations/**"
      - "scripts/run_migrations.py"
      - "k8s/**"
      - ".github/workflows/k8s-ci.yml"
  workflow_dispatch:

concurrency:
  group: k8s-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint k8s/charts/deployment-platform

      - name: Validate rendered manifests
        run: |
          helm template deployment-platform k8s/charts/deployment-platform \
            --set image.owner=local \
            --set image.tag=${{ github.sha }} \
            | docker run --rm -i ghcr.io/yannh/kubeconform -strict -summary

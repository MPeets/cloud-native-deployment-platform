{{- if .Values.migrations.enabled }}
# The database Secret must already exist before install or upgrade. pre-install and
# pre-upgrade hooks run before Helm creates chart resources, so this Job cannot
# depend on a Secret rendered by the chart.
# run_migrations.py takes a Postgres advisory lock, so concurrent runs are safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" (include "dp.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "dp.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dp.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.owner }}/devops-migrate:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: DATABASE_URL
{{- end }}

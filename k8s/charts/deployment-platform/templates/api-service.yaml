apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-api" (include "dp.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "dp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

{{- if .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-api" (include "dp.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "dp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}

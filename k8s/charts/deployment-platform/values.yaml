fullnameOverride: ""

image:
  # Docker Hub namespace. Images are <owner>/devops-api, <owner>/devops-worker, and <owner>/devops-migrate.
  owner: ""
  tag: ""
  pullPolicy: IfNotPresent

podAnnotations: {}

database:
  # Secret created outside this chart. Must contain key DATABASE_URL.
  existingSecret: dp-db

api:
  port: 3000
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

worker:
  replicaCount: 1
  env:
    WORKER_POLL_INTERVAL_MS: "5000"
    WORKER_PROCESSING_MS: "3000"
    WORKER_FAILURE_RATE: "0.1"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

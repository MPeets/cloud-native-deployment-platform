fullnameOverride: ""

image:
  # Docker Hub namespace. Images are <owner>/devops-api, <owner>/devops-worker, and <owner>/devops-migrate.
  owner: ""
  tag: ""
  pullPolicy: IfNotPresent

podAnnotations: {}

database:
  # Secret created outside this chart. Must contain key DATABASE_URL.
  existingSecret: dp-db

migrations:
  # Pre-install/pre-upgrade hook. The Secret above must already exist: hooks run before chart resources are created.
  enabled: true

api:
  port: 3000
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

worker:
  replicaCount: 1
  env:
    WORKER_POLL_INTERVAL_MS: "5000"
    WORKER_PROCESSING_MS: "3000"
    WORKER_FAILURE_RATE: "0.1"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
